aid: verdafresh
name: VerdaFresh
description: 'VerdaFresh is a Wayne, Pennsylvania materials-science company that develops
  water-based, saran-free oxygen barrier coatings for recyclable flexible food packaging.
  Its High Oxygen Barrier and Ultra High Barrier coatings are applied to BOPP, HD-BOPE,
  MDO-PE and PET film substrates to extend shelf life while keeping the finished package
  mono-material and recyclable, replacing PVdC and metallized structures. The company
  sells coatings and coated films to converters and CPG brands, is APR-recognized and
  a member of the U.S. Plastics Pact, and publishes technical datasheets rather than
  software. It is a physical-products manufacturer with no developer program, API,
  SDK or machine-readable interface of any kind.'
